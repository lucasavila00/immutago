version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - revive
    - funlen
    - lll
    - gocyclo
    - gocognit
    - depguard
    - nolintlint
  settings:
    nolintlint:
      require-specific: true
      require-explanation: true
    depguard:
      rules:
        core:
          files:
            - "**/internal/**"
          deny:
            - pkg: github.com/lucasavila00/immutago/pkg/analyzer
              desc: The analyzer calls the core, not the reverse.
            - pkg: github.com/lucasavila00/immutago/cmd/immutago
              desc: The command calls the analyzer, not the reverse.
    staticcheck:
      checks: ["SA*"]
    revive:
      rules:
        - name: exported
        - name: package-comments
        - name: var-naming
        - name: error-strings
        - name: error-return
    lll:
      line-length: 120
    funlen:
      lines: 100
      statements: -1
      ignore-comments: false
    gocognit:
      min-complexity: 20
    gocyclo:
      min-complexity: 20
  exclusions:
    paths:
      - testdata

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - testdata
